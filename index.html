const STAGES=[{"eyebrow":"פרק 01 · להכיר את הדמויות","headline":"מי שייך לאיזו משפחה?","hook":"הסיפור מתחיל בשתי משפחות שונות. אם מבינים מי שייך למי, כל ההמשך נעשה ברור.","glyph":"✦","color":"blue","frames":[{"tag":"העולם של אלקנה","title":"שתי נשים, מצבים שונים","verse":"ב׳","quote":"וַיְהִי לִפְנִנָּה יְלָדִים, וּלְחַנָּה אֵין יְלָדִים","say":"לאלקנה שתי נשים: חנה ופנינה. לפנינה ילדים; לחנה אין ילדים בתחילת הסיפור. זהו הבסיס למתח שנלמד בהמשך.","probe":"מה ההבדל הכתוב בין חנה לפנינה?","q":"f2"},{"tag":"משפחה שנייה","title":"הכוהנים בשילה","verse":"ג׳","quote":"וְשָׁם שְׁנֵי בְנֵי עֵלִי, חָפְנִי וּפִנְחָס","say":"עלי הוא הכהן. חפני ופינחס הם בניו, וגם הם כוהנים בשילה. הם אינם בניו של אלקנה.","probe":"מי הם חפני ופינחס?","q":"f1"},{"tag":"דמות מפתח","title":"עלי פוגש את חנה","verse":"י״ג–י״ז","quote":"וַיַּחְשְׁבֶהָ עֵלִי, לְשִׁכֹּרָה","say":"בהמשך הפרק, עלי רואה את חנה מתפללת בשקט וטועה בפירוש התנהגותה. לאחר שהוא שומע את הסברה הוא מברך אותה.","probe":"מה חשב עלי כשראה את תפילתה?","q":"f3"}]},{"eyebrow":"פרק 02 · להבין יחסים","headline":"מה כאב לחנה?","hook":"הפרק לא רק מספר מה קרה; הוא מראה איך מילים והתנהגות משפיעות על אדם.","glyph":"❋","color":"rose","frames":[{"tag":"נקודת הכאב","title":"למה חנה עצובה?","verse":"ב׳, ה׳","quote":"וּלְחַנָּה אֵין יְלָדִים","say":"לחנה אין ילדים. אלקנה אוהב אותה, אך הדבר אינו מבטל את מצוקתה. לפנינה יש ילדים והפער בולט.","probe":"מה ידוע לנו בוודאות מן הפסוקים?","q":"r1"},{"tag":"התנהגות חוזרת","title":"פנינה מכעיסה את חנה","verse":"ו׳–ז׳","quote":"וְכִעֲסַתָּה צָרָתָהּ גַּם כַּעַס","say":"פנינה, המכונה כאן ״צרתה״, מכעיסה את חנה. הדבר חוזר שנה בשנה. הכתוב אינו מסביר מהו המניע הפנימי של פנינה — לכן לא נקבע זאת כעובדה.","probe":"מה עשתה פנינה לפי הכתוב?","q":"r2"},{"tag":"תוצאות מעשים","title":"מה קורה לחנה?","verse":"ז׳","quote":"וַתִּבְכֶּה, וְלֹא תֹאכַל","say":"חנה בוכה ואינה אוכלת, וזו תגובה למצוקה שהכתוב מתאר. השילוב של מעשי פנינה ותגובת חנה עוזר להסביר את ההמשך.","probe":"מה מלמד הביטוי ״שנה בשנה״?","q":"r3"},{"tag":"ניסיון לנחם","title":"אלקנה רוצה לעזור","verse":"ח׳","quote":"הֲלוֹא אָנֹכִי טוֹב לָךְ, מֵעֲשָׂרָה בָנִים","say":"אלקנה פונה לחנה ומנסה לנחם אותה. הוא מבטא את אהבתו, אך כואב לה שאין לה ילדים. שימו לב להבדל בין כוונתו של אלקנה לבין הרגשתה של חנה.","probe":"כיצד מגיב אלקנה למצוקתה של חנה?","q":"r4"}]},{"eyebrow":"פרק 03 · המסע השנתי","headline":"למה עולים לשילה?","hook":"העלייה לשילה היא הרקע לאירועים — והיא גם המקום שבו מתחיל המפנה.","glyph":"⌂","color":"gold","frames":[{"tag":"יעד ומטרה","title":"לאן ולשם מה?","verse":"ג׳","quote":"מִיָּמִים יָמִימָה, לְהִשְׁתַּחֲוֺת וְלִזְבֹּחַ","say":"אלקנה עולה מעירו לשילה מדי שנה לעבוד את ה׳ באמצעות השתחוויה וזבח. הפסוקים אינם מציינים שם של חג מסוים.","probe":"לאן עלתה המשפחה?","q":"s1"},{"tag":"הקשר למקום","title":"מה מתרחש בזמן הזבח?","verse":"ג׳–ד׳","quote":"וַיִּזְבַּח אֶלְקָנָה","say":"שילה היא מקום עבודת ה׳ בסיפור; שם גם נמצאים עלי ובניו הכוהנים. בעת הזבח אלקנה מחלק מנות לבני משפחתו.","probe":"מה מטרת העלייה לפי הפסוק?","q":"s2"},{"tag":"לא לקפוץ למסקנות","title":"המנה של חנה","verse":"ה׳","quote":"מָנָה אַחַת אַפָּיִם","say":"זהו ביטוי שיש לו פירושים שונים. ידוע שאלקנה אוהב את חנה; לא נכון לקבוע מכאן בוודאות מספר מסוים של מנות.","probe":"מה אפשר לומר בביטחון על הביטוי?","q":"s3"},{"tag":"הקשר לעלילה","title":"למה שילה משמעותית?","verse":"ז׳–י׳","quote":"וַתָּקָם חַנָּה","say":"העלייה השנתית היא גם זמן של קושי לחנה, ובהמשך היא מתפללת בשילה ונפגשת עם עלי. חשוב להסביר את הקשר, לא רק לשנן את שם המקום.","probe":"איזה חג נזכר בפסוקים?","q":"s4"}]},{"eyebrow":"פרק 04 · נקודת המפנה","headline":"התפילה והנדר של חנה","hook":"כאן מתחברים הרגש, הבקשה, ההתחייבות והמפגש עם עלי — ועד סוף פסוק כ״א.","glyph":"✧","color":"teal","frames":[{"tag":"מתוך כאב","title":"מה חנה מבקשת?","verse":"י׳–י״א","quote":"וְנָתַתָּה לַאֲמָתְךָ זֶרַע אֲנָשִׁים","say":"חנה מתפללת מתוך צער ומבקשת בן. ״זרע אנשים״ הוא ביטוי מקראי בבקשתה. הבקשה עצמה אינה כל הנדר.","probe":"מה חנה מבקשת בתפילתה?","q":"v1"},{"tag":"בקשה מול התחייבות","title":"מה בדיוק היא מבטיחה?","verse":"י״א","quote":"וּנְתַתִּיו לַיהוָה כָּל יְמֵי חַיָּיו, וּמוֹרָה לֹא יַעֲלֶה עַל רֹאשׁוֹ","say":"אם ייוולד לה בן, חנה מתחייבת להקדישו לה׳ כל ימי חייו, ותער לא יעלה על ראשו. זו התחייבות מותנית: ״אם... אז...״.","probe":"מה כוללת ההתחייבות?","q":"v2"},{"tag":"מסקנה מהירה מדי","title":"מה עלי רואה — ומה הוא חושב?","verse":"י״ב–ט״ז","quote":"רַק שְׂפָתֶיהָ נָּעוֹת, וְקוֹלָהּ לֹא יִשָּׁמֵעַ","say":"עלי רואה ששפתיה של חנה נעות וקולה אינו נשמע, ומניח בטעות שהיא שיכורה. חנה מסבירה שהיא מתפללת מתוך קושי וצער ולא שתתה יין או שכר.","probe":"מדוע עלי טועה?","q":"v3"},{"tag":"שינוי בעקבות תפילה","title":"מה קורה אחרי דברי עלי?","verse":"י״ז–י״ח","quote":"וַתֵּלֶךְ הָאִשָּׁה לְדַרְכָּהּ וַתֹּאכַל","say":"עלי מברך אותה, והיא יוצאת לאכול ופניה אינן כבעבר. השינוי מתרחש עוד לפני לידת הבן; עלי מברך ואינו מבטיח בוודאות בן.","probe":"מה משתנה אצל חנה?","q":"v4"},{"tag":"סיום גבול החומר","title":"לידת שמואל ופסוק כ״א","verse":"י״ט–כ״א","quote":"וַתִּקְרָא אֶת שְׁמוֹ שְׁמוּאֵל, כִּי מֵיְהוָה שְׁאִלְתִּיו","say":"לאחר החזרה לרמה חנה יולדת בן וקוראת לו שמואל. בפסוק כ״א נזכר גם נדרו של אלקנה, שתוכנו אינו מפורט כאן. כאן מסתיים החומר לבוחן.","probe":"מדוע נקרא הילד שמואל?","q":"v5"}]}];
const VERSES=[{"number":"א׳","text":"ויהי איש אחד מן הרמתים צופים מהר אפרים ושמו אלקנה בן ירחם בן אליהוא בן תחו בן צוף אפרתי."},{"number":"ב׳","text":"ולו שתי נשים שם אחת חנה ושם השנית פננה ויהי לפננה ילדים ולחנה אין ילדים."},{"number":"ג׳","text":"ועלה האיש ההוא מעירו מימים ימימה להשתחות ולזבח לה׳ צבאות בשלה ושם שני בני עלי חפני ופנחס כהנים לה׳."},{"number":"ד׳","text":"ויהי היום ויזבח אלקנה ונתן לפננה אשתו ולכל בניה ובנותיה מנות."},{"number":"ה׳","text":"ולחנה יתן מנה אחת אפים כי את חנה אהב וה׳ סגר רחמה."},{"number":"ו׳","text":"וכעסתה צרתה גם כעס בעבור הרעמה כי סגר ה׳ בעד רחמה."},{"number":"ז׳","text":"וכן יעשה שנה בשנה מדי עלתה בבית ה׳ כן תכעסנה ותבכה ולא תאכל."},{"number":"ח׳","text":"ויאמר לה אלקנה אישה חנה למה תבכי ולמה לא תאכלי ולמה ירע לבבך הלוא אנכי טוב לך מעשרה בנים."},{"number":"ט׳","text":"ותקם חנה אחרי אכלה בשלה ואחרי שתה ועלי הכהן ישב על הכסא על מזוזת היכל ה׳."},{"number":"י׳","text":"והיא מרת נפש ותתפלל על ה׳ ובכה תבכה."},{"number":"י״א","text":"ותדר נדר ותאמר ה׳ צבאות אם ראה תראה בעני אמתך וזכרתני ולא תשכח את אמתך ונתתה לאמתך זרע אנשים ונתתיו לה׳ כל ימי חייו ומורה לא יעלה על ראשו."},{"number":"י״ב","text":"והיה כי הרבתה להתפלל לפני ה׳ ועלי שמר את פיה."},{"number":"י״ג","text":"וחנה היא מדברת על לבה רק שפתיה נעות וקולה לא ישמע ויחשבה עלי לשכרה."},{"number":"י״ד","text":"ויאמר אליה עלי עד מתי תשתכרין הסירי את יינך מעליך."},{"number":"ט״ו","text":"ותען חנה ותאמר לא אדני אשה קשת רוח אנכי ויין ושכר לא שתיתי ואשפך את נפשי לפני ה׳."},{"number":"ט״ז","text":"אל תתן את אמתך לפני בת בליעל כי מרב שיחי וכעסי דברתי עד הנה."},{"number":"י״ז","text":"ויען עלי ויאמר לכי לשלום ואלהי ישראל יתן את שלתך אשר שאלת מעמו."},{"number":"י״ח","text":"ותאמר תמצא שפחתך חן בעיניך ותלך האשה לדרכה ותאכל ופניה לא היו לה עוד."},{"number":"י״ט","text":"וישכמו בבקר וישתחוו לפני ה׳ וישבו ויבאו אל ביתם הרמתה וידע אלקנה את חנה אשתו ויזכרה ה׳."},{"number":"כ׳","text":"ויהי לתקפות הימים ותהר חנה ותלד בן ותקרא את שמו שמואל כי מה׳ שאלתיו."},{"number":"כ״א","text":"ויעל האיש אלקנה וכל ביתו לזבח לה׳ את זבח הימים ואת נדרו."}];

function renderHome(){const p=profile(),s=state(),pct=progressPct(),next=STAGES.findIndex((x,i)=>completed(i)<x.frames.length);const n=next<0?3:next;const can=STAGES[n];const circumference=2*Math.PI*48;writeMain(`<div class="hero"><div class="hero-copy"><div class="eyebrow">החוויה שלך · תנ״ך כיתה ז׳</div><h1>הסיפור מתחיל<br>בשילה.</h1><p>ארבע תחנות. עשרים ואחד פסוקים. סיפור אחד שמבינים לעומק — ולא רק משננים.</p><div class="hero-actions"><button class="btn" onclick="chooseModule(${n})">${pct===100?'ללמוד שוב':'ממשיכים מהתחנה הבאה'} <span>←</span></button><button class="btn outline" onclick="go('timeline')">מפת הסיפור</button></div></div><div class="hero-art" aria-hidden="true">${ILLUSTRATION}</div></div><div class="dashboard"><div class="card progress-panel"><div><div class="eyebrow">ברוכים השבים, ${esc(p.nick)}</div><h3>המסע האישי שלך</h3><p>כבר השלמת ${completedFrames()} מתוך ${allFrames()} צעדי הבנה. כל תשובה נכונה מקדמת אותך במסלול.</p><div class="fine" style="margin-top:13px">${s.examHistory.length?'התוצאה האחרונה בבוחן: '+s.examHistory.at(-1).score+'%':'הבוחן המסכם מחכה בסוף הדרך'}</div></div><div class="progress-circle" aria-label="${pct} אחוזי התקדמות"><svg viewBox="0 0 118 118"><circle cx="59" cy="59" r="48" stroke="#e6ebeb" fill="none" stroke-width="10"/><circle cx="59" cy="59" r="48" stroke="#18857b" fill="none" stroke-linecap="round" stroke-width="10" stroke-dasharray="${circumference}" stroke-dashoffset="${circumference*(1-pct/100)}"/></svg><div class="pct">${pct}%</div></div></div><div class="tip-panel"><div class="eyebrow">מתוך הפסוקים</div><h3>החוכמה היא לא רק לדעת מה קרה</h3><p>אלא גם לדעת <b>איפה זה כתוב</b>, להסביר את המשמעות ולבסס תשובה. בשביל זה יש חדר אימון מיוחד.</p><div style="margin-top:16px">${NAVB('proof','תרגול ראיות →','ghost')}</div></div></div><div class="section-head"><div><h2>ארבע תחנות. מסע אחד.</h2><p>לומדים דרך רגעים מהסיפור, עונים, ומקבלים הסבר ברור.</p></div><span class="feature-pill">פסוקים א׳–כ״א בלבד</span></div><div class="grid cols4">${STAGES.map((x,i)=>`<article class="card unit" style="--accent:${['#dde8f7','#f7dbe5','#fae9ca','#d7eee6'][i]}"><div class="unit-top"><span class="unit-index">תחנה ${i+1}</span><span class="unit-glyph">${x.glyph}</span></div><h3>${esc(x.headline)}</h3><p>${esc(x.hook)}</p><div class="unit-foot"><div><div class="microbar"><i style="width:${Math.round(completed(i)/x.frames.length*100)}%"></i></div><small class="fine">${completed(i)} מתוך ${x.frames.length} צעדים</small></div><a href="#" onclick="chooseModule(${i});return false">${completed(i)===x.frames.length?'חזרה':'כניסה'} ←</a></div></article>`).join('')}</div><div class="statstrip"><div class="statitem"><b>${s.examHistory.length}</b><span>בחנים שבוצעו</span></div><div class="statitem"><b>${Object.keys(s.proof).filter(k=>s.proof[k]===true).length}/${PROOFS.length}</b><span>ראיות שנלמדו</span></div><div class="statitem"><b>${s.streak||1}</b><span>ימי למידה רצופים</span></div></div>`)}
const ILLUSTRATION=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a2b7b6"/><stop offset="1" stop-color="#e3cda7"/></linearGradient></defs><circle cx="390" cy="78" r="39" fill="#f4c97f" opacity=".95"/><path d="M0 290Q110 205 205 251T520 207V360H0Z" fill="#647969"/><path d="M0 330Q142 246 244 295T520 259V360H0Z" fill="#394b4d"/><path d="M195 300v-150h174v150" fill="#d9c7a8" stroke="#bca277" stroke-width="4"/><path d="M179 158l99-68 109 68" fill="none" stroke="#e6d3ad" stroke-width="19" stroke-linejoin="round"/><path d="M212 158h138v144H212z" fill="#d6bc91"/><path d="M255 205h52v95h-52z" fill="#314451"/><path d="M220 175h35v24h-35zM308 175h35v24h-35z" fill="#a58b68"/><path d="M175 300h220" stroke="#f2e7cc" stroke-width="6"/><path d="M110 340Q240 314 282 360" stroke="#bdb18d" stroke-width="28" fill="none" opacity=".6"/><circle cx="90" cy="75" r="4" fill="#f9d6a2"/><circle cx="124" cy="51" r="3" fill="#f9d6a2"/></svg>`;
function renderLesson(){let st=STAGES[chapter],max=st.frames.length;beat=Math.min(Math.max(0,beat),max-1);const b=st.frames[beat],d=frameDone(chapter,beat);const pos=state().lessonPos[chapter]||{};const selected=pos[beat]?.chosen;const q=questions.find(x=>x.id===b.q);let choices=q.opts.map((x,i)=>`<button class="choice ${selected===i?(i===q.correct?'correct':'wrong'):''}" ${d?'disabled':''} onclick="answerFrame(${i})">${esc(x)}</button>`).join(''); const fb=selected!==undefined?(selected===q.correct?`<div class="feedback good">✓ נכון. ${esc(q.why)} <div style="margin-top:9px">${esc(b.say)}</div></div>`:`<div class="feedback bad">כדאי לבדוק שוב את הפסוק. ${esc(q.why)} — אפשר לבחור תשובה אחרת.</div>`):'';
writeMain(`<div class="page-header"><div><div class="eyebrow">${esc(st.eyebrow)}</div><h1>${esc(st.headline)}</h1><p>${esc(st.hook)}</p></div><button class="btn ghost" onclick="go('home')">חזרה למסלול</button></div><div class="lesson-shell"><aside class="card lesson-rail"><div class="smallcap">רגעים בסיפור</div>${st.frames.map((f,i)=>`<button ${i>0&&!frameDone(chapter,i-1)?'disabled':''} class="${beat===i?'sel':''}" onclick="setBeat(${i})"><span class="stepdot">${frameDone(chapter,i)?'✓':i+1}</span><span>${esc(f.title)}</span></button>`).join('')}</aside><article class="card lesson-card"><div class="lesson-cover"><div class="eyebrow">${esc(b.tag)} · פסוקים ${esc(b.verse)}</div><h2>${esc(b.title)}</h2><p>רגע ${beat+1} מתוך ${max} • קוראים, מבינים, מוכיחים</p></div><div class="lesson-step"><div class="step-meta"><span>שלב הבנה ${beat+1} מתוך ${max}</span><span>${d?'הושלם ✓':'בדרך להבנה'}</span></div><div class="verse-block"><span class="ref">הראיה מן הפסוק • ${esc(b.verse)}</span><blockquote>${esc(b.quote)}</blockquote></div><p class="explain">${esc(b.say)}</p><div class="think"><h3>נעצור ונחשוב</h3><div>${esc(b.probe)}</div><div class="choices">${choices}</div>${fb}</div><div class="step-footer"><button class="btn ghost" onclick="setBeat(${Math.max(0,beat-1)})" ${beat===0?'disabled':''}>הקודם</button>${d?`<button class="btn gold" onclick="nextBeat()">${beat===max-1?'סיום התחנה וחזרה למסלול':'ממשיכים לרגע הבא ←'}</button>`:'<span class="fine">ענו נכון כדי להתקדם • אפשר לנסות שוב</span>'}</div>${d&&beat===max-1?`<div class="mastery-info"><b>כל הכבוד, התחנה הושלמה!</b><br>כעת תוכלו לנסות שאלות חדשות בחדר האימון או להמשיך לתחנה הבאה.</div>`:''}</div></article></div>`)}
function setBeat(i){if(i>0&&!frameDone(chapter,i-1))return;beat=Math.min(Math.max(i,0),STAGES[chapter].frames.length-1);renderLesson()}
function nextBeat(){const max=STAGES[chapter].frames.length;if(!frameDone(chapter,beat))return;if(beat<max-1){beat++;renderLesson();window.scrollTo({top:0,behavior:'smooth'})}else{const s=state();if(!s.doneLessons.includes(chapter))s.doneLessons.push(chapter);save();if(chapter<3){chapter++;beat=0;renderLesson();window.scrollTo({top:0,behavior:'smooth'})}else go('home')}}
function answerFrame(i){const s=state(),b=STAGES[chapter].frames[beat],q=questions.find(x=>x.id===b.q);if(!s.lessonPos[chapter])s.lessonPos[chapter]={};s.lessonPos[chapter][beat]={chosen:i,when:Date.now()};if(i===q.correct&&!frameDone(chapter,beat)){s.doneFrames.push(frameKey(chapter,beat));if(completed(chapter)===STAGES[chapter].frames.length&&!s.doneLessons.includes(chapter))s.doneLessons.push(chapter)}save();renderLesson()}
function renderCharacters(){writeMain(`<div class="page-header"><div><div class="eyebrow">תחנת עזר · מפת דמויות</div><h1>שתי משפחות, סיפור אחד</h1><p>הדבר הראשון שצריך להבין: אלקנה ועלי אינם אותו אדם. לכל אחד מהם תפקיד אחר.</p></div>${NAVB('lesson','ללמוד עם הדמויות','ghost')}</div><div class="familygrid"><div class="card family-card"><div class="eyebrow">משפחת אלקנה</div><h2>המשפחה שעולה לשילה</h2><div class="people"><div class="person"><span class="face">◈</span><span><b>אלקנה</b><small>בעלן של חנה ופנינה; עולה מדי שנה לשילה</small></span></div><div class="person"><span class="face">✿</span><span><b>חנה</b><small>אין לה ילדים בתחילת הסיפור; מתפללת ונודרת נדר</small></span></div><div class="person"><span class="face">❀</span><span><b>פנינה</b><small>יש לה ילדים; מכעיסה את חנה</small></span></div></div></div><div class="card family-card"><div class="eyebrow">משפחת עלי</div><h2>הכוהנים בשילה</h2><div class="people"><div class="person"><span class="face">♙</span><span><b>עלי</b><small>כהן בשילה; פוגש את חנה ומתייחס לתפילתה</small></span></div><div class="person"><span class="face">♢</span><span><b>חפני</b><small>בנו של עלי; מוזכר ככהן בשילה</small></span></div><div class="person"><span class="face">♢</span><span><b>פינחס</b><small>בנו של עלי; מוזכר ככהן בשילה</small></span></div></div></div></div><div class="notice" style="margin-top:19px"><b>דיוק מהמקור:</b> בתוך הפסוקים שנקבעו לבוחן לא מתוארות פעולות מיוחדות של חפני ופינחס מעבר לאזכורם ככוהנים בשילה.</div>`)}
function renderTimeline(){writeMain(`<div class="page-header"><div><div class="eyebrow">10 רגעים · כל הסיפור במקום אחד</div><h1>איך הסיפור מתקדם?</h1><p>מפה חזותית של האירועים. העיגולים ממוספרים כדי למנוע בלבול בכיווני חצים בעברית.</p></div>${NAVB('library','אל הפסוקים המקוריים','ghost')}</div><div class="storymap">${timeline.map(e=>`<article class="card story-node"><span class="n">רגע ${e[0]}</span><h3>${esc(e[1])}</h3><p>${esc(e[2])}</p><span class="versetag">פסוקים ${esc(e[3])}</span></article>`).join('')}</div><div class="notice" style="margin-top:19px">גבול החומר הוא פסוק כ״א. האתר לא ממשיך את העלילה מעבר לנקודה הזאת.</div>`)}
function practiceSet(){const s=state();const topics=['families','relations','shiloh','vow'];const ids=questions.filter(x=>trainingFilter==='all'||x.topic===topics[Number(trainingFilter)]);return ids.sort((a,b)=>((s.practice[a.id]?.correct||0)-(s.practice[a.id]?.wrong||0)) - ((s.practice[b.id]?.correct||0)-(s.practice[b.id]?.wrong||0)))}
function renderTraining(){const set=practiceSet();trainQ=Math.min(trainQ,Math.max(0,set.length-1));const q=set[trainQ],p=state().practice[q.id]||{},done=p.last!==undefined;writeMain(`<div class="page-header"><div><div class="eyebrow">אימון פעיל · לומדים מטעויות</div><h1>חדר אימון אישי</h1><p>השאלות שבהן התקשית מקבלות עדיפות. אפשר לנסות שוב בלי לאבד את ההתקדמות.</p></div><span class="feature-pill">${Object.keys(state().practice).length} שאלות תורגלו</span></div><div class="practice-toolbar">${[['all','הכול'],...STAGES.map((x,i)=>[String(i),x.headline])].map(([id,label])=>`<button class="chip ${trainingFilter===id?'on':''}" onclick="filterTraining('${id}')">${esc(label)}</button>`).join('')}</div><article class="card questioncard"><div class="qnumber">תרגול ${trainQ+1} מתוך ${set.length} · ${esc(STAGES.find(x=>x.frames.some(f=>f.q===q.id))?.headline||'זוכרים את הסיפור')}</div><h2>${esc(q.q)}</h2><div class="choices">${q.opts.map((op,i)=>`<button class="choice ${p.last===i?(i===q.correct?'correct':'wrong'):''}" onclick="practiceAnswer('${q.id}',${i})">${esc(op)}</button>`).join('')}</div>${done?`<div class="feedback ${p.last===q.correct?'good':'bad'}">${p.last===q.correct?'✓ תשובה נכונה.':'התשובה הנכונה: '+esc(q.opts[q.correct])+'.'} ${esc(q.why)}</div>`:''}<div class="step-footer"><button class="btn ghost" onclick="trainQ=(trainQ+${set.length-1})%${set.length};renderTraining()">שאלה קודמת</button><button class="btn gold" onclick="trainQ=(trainQ+1)%${set.length};renderTraining()">השאלה הבאה ←</button></div></article>`)}
function filterTraining(v){trainingFilter=v;trainQ=0;renderTraining()}
function practiceAnswer(id,i){const q=questions.find(x=>x.id===id),s=state();let v=s.practice[id]||{correct:0,wrong:0};v.last=i;v.when=Date.now();if(i===q.correct)v.correct++;else v.wrong++;s.practice[id]=v;save();renderTraining()}
function renderProof(){const pr=PROOFS[proofIndex];const v=state().proof['p'+proofIndex];writeMain(`<div class="page-header"><div><div class="eyebrow">קוראים כמו חוקרי תנ״ך</div><h1>איפה זה כתוב?</h1><p>תרגול שלא מסתפק בניחוש: בחרו את הראיה מתוך הפסוקים שמוכיחה את הטענה.</p></div><span class="feature-pill">${Object.values(state().proof).filter(x=>x===true).length}/${PROOFS.length} הוכחות נפתרו</span></div><article class="card proofcard"><span class="eyebrow">טענה ${proofIndex+1} מתוך ${PROOFS.length}</span><h3>${esc(pr.claim)}</h3><p class="text-muted">איזה ציטוט מהמקרא הוא הראיה המדויקת ביותר לטענה?</p><div class="choices">${pr.opts.map((o,i)=>`<button class="choice ${v===true&&i===pr.answer?'correct':''}" onclick="chooseProof(${i})">${esc(o)}</button>`).join('')}</div>${v===true?`<div class="feedback good">✓ מצאת את הראיה. ${esc(pr.why)}</div>`:''}<div class="step-footer"><button class="btn ghost" onclick="proofIndex=Math.max(0,proofIndex-1);renderProof()" ${proofIndex===0?'disabled':''}>הקודמת</button><button class="btn gold" onclick="proofIndex=Math.min(PROOFS.length-1,proofIndex+1);renderProof()" ${proofIndex===PROOFS.length-1?'disabled':''}>הטענה הבאה ←</button></div></article><div class="extradeal"><h3>איך כותבים תשובה חזקה בבוחן?</h3><div class="grid cols3"><div><b>1. טענה</b><p class="fine">מה התשובה לשאלה?</p></div><div><b>2. הסבר</b><p class="fine">מה הקשר בין האירועים?</p></div><div><b>3. ראיה</b><p class="fine">איזה פסוק תומך בדבריך?</p></div></div></div>`)}
function chooseProof(i){const v=PROOFS[proofIndex];if(i===v.answer){state().proof['p'+proofIndex]=true;save();renderProof()}else{const node=document.querySelectorAll('.proofcard .choice')[i];node?.classList.add('wrong');const el=document.querySelector('.proofcard .feedback');if(!el)document.querySelector('.proofcard .choices').insertAdjacentHTML('afterend','<div class="feedback bad">עדיין לא. חפשו פסוק שמתייחס ישירות לטענה, ולא רק פרט אחר בסיפור.</div>')}}
const EXAM_IDS=['f1','f3','r1','r2','r3','r4','s1','s2','s3','v1','v2','v3','v4','v5','v6'];
function examQuestions(){return EXAM_IDS.map(id=>questions.find(q=>q.id===id))}
function renderExam(){const qs=examQuestions(),s=state(),filled=Object.keys(s.examAnswers).length,done=showExamResults;writeMain(`<div class="page-header"><div><div class="eyebrow">בדיקת מוכנות עצמית</div><h1>הבוחן המסכם</h1><p>שאלות על כל ארבעת הנושאים. בסיום תראו את הנושאים שדורשים חזרה ואת התשובות המנומקות.</p></div><span class="feature-pill">${s.examHistory.length?'שיא אישי: '+Math.max(...s.examHistory.map(x=>x.score))+'%':'בלי לחץ. לומדים גם מטעויות.'}</span></div>${done?renderExamResults():`<div class="exam-grid"><article class="card questioncard" style="margin:0"><span class="eyebrow">שאלה ${examIndex+1} מתוך ${qs.length}</span><div class="exam-progress"><i style="width:${Math.round(filled/qs.length*100)}%"></i></div><h2>${esc(qs[examIndex].q)}</h2><div class="choices">${qs[examIndex].opts.map((o,i)=>`<button class="choice ${s.examAnswers[qs[examIndex].id]===i?'selected':''}" onclick="examAnswer('${qs[examIndex].id}',${i})">${esc(o)}</button>`).join('')}</div><div class="step-footer"><button class="btn ghost" onclick="examIndex=Math.max(0,examIndex-1);renderExam()" ${examIndex===0?'disabled':''}>הקודמת</button>${filled===qs.length?`<button class="btn gold" onclick="submitExam()">הגשת הבוחן</button>`:`<button class="btn gold" onclick="examIndex=Math.min(${qs.length-1},examIndex+1);renderExam()">הבאה ←</button>`}</div></article><aside class="card exam-rail"><h3>כל השאלות</h3><div class="number-grid">${qs.map((q,i)=>`<button class="qnum ${examIndex===i?'current':''} ${s.examAnswers[q.id]!==undefined?'answered':''}" onclick="examIndex=${i};renderExam()">${i+1}</button>`).join('')}</div><p class="fine" style="margin-top:16px">${filled} מתוך ${qs.length} נענו • התשובות נשמרות אוטומטית</p></aside></div>`}<div class="section-head"><div><h2>גם שאלות פתוחות חשובות</h2><p>תשובה טובה בתנ״ך כוללת טענה, הסבר וראיה.</p></div></div>${renderWritten()}`)}
function examAnswer(id,i){state().examAnswers[id]=i;save();renderExam()}
function submitExam(){const qs=examQuestions(),s=state();if(qs.some(q=>s.examAnswers[q.id]===undefined))return;const cnt=qs.filter(q=>s.examAnswers[q.id]===q.correct).length;const score=Math.round(cnt/qs.length*100);s.examHistory.push({when:Date.now(),score,correct:cnt,total:qs.length});showExamResults=true;save();renderExam();window.scrollTo({top:0,behavior:'smooth'})}
function renderExamResults(){const s=state(),qs=examQuestions(),ok=qs.filter(q=>s.examAnswers[q.id]===q.correct).length,score=Math.round(ok/qs.length*100),wrong=qs.filter(q=>s.examAnswers[q.id]!==q.correct);return `<section class="exam-finish"><div class="eyebrow">הבוחן הסתיים</div><div class="result-score">${score}%</div><h2>${score>=85?'יש בסיס טוב להמשך!':'זיהינו במה כדאי להתמקד'}</h2><p>${ok} מתוך ${qs.length} תשובות נכונות. התוצאה נשמרה בפרופיל שלך.</p><div class="modal-actions"><button class="btn teal" onclick="retakeExam()">בוחן חדש</button><button class="btn ghost" onclick="go('training')">חיזוק בחדר האימון</button></div></section>${wrong.length?`<div class="section-head"><h2>השאלות שמומלץ לחזור עליהן</h2></div>${wrong.map(q=>`<div class="weak-card"><b>${esc(q.q)}</b><div class="fine">התשובה הנכונה: ${esc(q.opts[q.correct])}</div><p style="margin:6px 0 0">${esc(q.why)}</p></div>`).join('')}`:`<div class="mastery-info">כל השאלות נכונות! כדאי לנסות גם את המשימות הפתוחות והראיות מהפסוקים.</div>`}`}
function retakeExam(){state().examAnswers={};save();showExamResults=false;examIndex=0;renderExam()}
function renderWritten(){return written.map((w,i)=>`<article class="card written-task"><h3>משימה פתוחה ${i+1}</h3><p>${esc(w.q)}</p><textarea id="written${i}" placeholder="כתבו תשובה במילים שלכם. אפשר להוסיף ראיה מהפסוק." oninput="saveWritten(${i},this.value)">${esc(state().written[i]?.text||'')}</textarea><div class="writing-actions"><button class="btn small ghost" onclick="document.getElementById('model${i}').hidden=false">הצגת תשובה לדוגמה</button><button class="btn small outline" onclick="markWritten(${i},true)">הצלחתי בעצמי</button><button class="btn small outline" onclick="markWritten(${i},false)">דורש חזרה</button></div><div id="model${i}" hidden class="answer-model">${esc(w.a)}</div><p class="fine" id="written-status-${i}">${state().written[i]?.passed===true?'סומן כהושלם':state().written[i]?.passed===false?'סומן לחזרה':''}</p></article>`).join('')}
function saveWritten(i,t){state().written[i]={...(state().written[i]||{}),text:t};save()}
function markWritten(i,passed){state().written[i]={...(state().written[i]||{}),passed};save();$('written-status-'+i).textContent=passed?'סומן כהושלם':'סומן לחזרה'}
function renderLibrary(){writeMain(`<div class="page-header"><div><div class="eyebrow">המקור לפני כל פרשנות</div><h1>קוראים מתוך התנ״ך</h1><p>כל 21 הפסוקים שנקבעו לבוחן, בנוסח ללא ניקוד. הסבר קודם לא מחליף קריאה במקור.</p></div><button class="btn ghost" onclick="document.body.classList.toggle('large-text')">להגדיל טקסט</button></div><div class="section-head"><div><h2>פסוקים א׳–כ״א</h2><p>הקפידו לקרוא כל פסוק לפני שאתם מנסים להסביר אותו.</p></div></div><div class="versebook">${VERSES.map((v,i)=>`<article class="verse-item"><b>פסוק ${esc(v.number)}</b><p>${esc(v.text)}</p></article>`).join('')}</div><div class="section-head"><div><h2>מילון ביטויים מהסיפור</h2><p>נוגעים בכרטיס כדי לגלות פירוש. כך נתרגל שליפה ולא רק קריאה.</p></div></div><div class="glossary-grid">${glossary.map((x,i)=>`<article class="card wordcard ${state().flash[i]?'flipped':''}" onclick="flipWord(${i},this)" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();flipWord(${i},this)}"><div class="eyebrow">מילה מן המקרא</div><h3>${esc(x[0])}</h3><div class="hint">לחצו להצגת פירוש</div><div class="definition">${esc(x[1])}</div></article>`).join('')}</div><div class="notice" style="margin-top:19px">חשוב: האתר אינו כולל את המשך הסיפור מפסוק כ״ב ואילך.</div>`)}
function flipWord(i,el){state().flash[i]=!state().flash[i];save();el.classList.toggle('flipped');}
function drawInitial(){init()}document.addEventListener('DOMContentLoaded',drawInitial);
</script>
</body></html>
